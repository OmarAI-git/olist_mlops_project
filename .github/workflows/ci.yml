name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/ checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements/dev.txt

      - name: Run Ruff lint
        run: |
          ruff check .

      - name: Check formating
        run: |
          ruff format --check .

      - name: Run tests
        run: |
          pytest -q



